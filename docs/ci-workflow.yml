name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  contract-check:
    name: Contract files match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check contract constants match
        run: bash scripts/check_contract.sh

  build-and-test:
    name: Flutter & Kotlin analyze, test, and APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build debug APK (also initializes Android Gradle wrapper & local.properties)
        run: flutter build apk --debug

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: road-runner-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
