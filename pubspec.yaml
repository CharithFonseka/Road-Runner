name: road_runner
description: "Road Runner — Android running tracker prototype."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State management (SRS §3.1)
  flutter_riverpod: ^2.6.1

  # Local storage — SQLite (SRS §3.1)
  sqflite: ^2.4.1

  # Navigation (SRS §3.1)
  go_router: ^14.6.3

  # Permissions UI (SRS §3.1)
  permission_handler: ^11.3.1

  # Live street map (OpenFreeMap serves vector tiles).
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.11.0
  latlong2: ^0.9.1

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
